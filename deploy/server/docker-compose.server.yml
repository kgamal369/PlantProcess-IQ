name: "${COMPOSE_PROJECT_NAME:-plantprocessiq}"

services:
  postgres:
    image: postgres:17-alpine
    container_name: ppiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_APP_DB:-plantprocessiq}"
      POSTGRES_USER: "${POSTGRES_USER:-plantprocess_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in runtime env}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ppiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantprocess_app} -d ${POSTGRES_APP_DB:-plantprocessiq}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ppiq-net

  plantprocess-api:
    image: plantprocessiq/api:${PPIQ_IMAGE_TAG:-local}
    build:
      context: ../../Backend
      dockerfile: PlantProcess.Api/Dockerfile
    container_name: ppiq-app-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://0.0.0.0:5063}"
      PLANTPROCESS_ALLOWED_ORIGINS: "${PLANTPROCESS_ALLOWED_ORIGINS}"
      ConnectionStrings__PlantProcessDb: "${ConnectionStrings__PlantProcessDb:?ConnectionStrings__PlantProcessDb must be set in runtime env}"
      PlantProcess__Auth__SigningKey: "${PlantProcess__Auth__SigningKey:?PlantProcess__Auth__SigningKey must be set in runtime env}"
      PlantProcess__Auth__BootstrapAdminPassword: "${PlantProcess__Auth__BootstrapAdminPassword:-${PPIQ_BOOTSTRAP_ADMIN_PASSWORD}}"
      PlantProcess__Auth__RefreshTokenDays: "${PlantProcess__Auth__RefreshTokenDays:-30}"
      PPIQ_BOOTSTRAP_ADMIN_USER: "${PPIQ_BOOTSTRAP_ADMIN_USER:-customer-owner}"
      PPIQ_BOOTSTRAP_ADMIN_PASSWORD: "${PPIQ_BOOTSTRAP_ADMIN_PASSWORD:?PPIQ_BOOTSTRAP_ADMIN_PASSWORD must be set in runtime env}"
      PPIQ_SMOKE_USERNAME: "${PPIQ_SMOKE_USERNAME:-customer-smoke}"
      PPIQ_SMOKE_PASSWORD: "${PPIQ_SMOKE_PASSWORD:?PPIQ_SMOKE_PASSWORD must be set in runtime env}"
    ports:
      - "${PLANTPROCESS_API_HOST_PORT:-5063}:5063"
    volumes:
      - ppiq_api_logs:/app/logs
      - ppiq_reports:/app/reports
      - ppiq_app_dumps:/app/app-dumps
    networks:
      - ppiq-net

  plantprocess-workers:
    image: plantprocessiq/workers:${PPIQ_IMAGE_TAG:-local}
    build:
      context: ../../Backend
      dockerfile: PlantProcess.Workers/Dockerfile
    container_name: ppiq-app-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-Production}"
      ConnectionStrings__PlantProcessDb: "${ConnectionStrings__PlantProcessDb:?ConnectionStrings__PlantProcessDb must be set in runtime env}"
    volumes:
      - ppiq_worker_logs:/app/logs
      - ppiq_reports:/app/reports
      - ppiq_app_dumps:/app/app-dumps
    networks:
      - ppiq-net

  plantprocess-app-web:
    image: plantprocessiq/app-web:${PPIQ_IMAGE_TAG:-local}
    build:
      context: ../../Frontend/PlantProcess.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
    container_name: ppiq-app-web
    restart: unless-stopped
    depends_on:
      - plantprocess-api
    ports:
      - "${PLANTPROCESS_APP_WEB_HOST_PORT:-5173}:80"
    networks:
      - ppiq-net

  plantprocess-website:
    image: plantprocessiq/website:${PPIQ_IMAGE_TAG:-local}
    build:
      context: ../../Website/PlantProcess.Website
      dockerfile: Dockerfile
      args:
        VITE_WEBSITE_API_BASE_URL: "${VITE_WEBSITE_API_BASE_URL:-}"
    container_name: ppiq-website-web
    restart: unless-stopped
    ports:
      - "${PLANTPROCESS_WEBSITE_HOST_PORT:-5080}:80"
    networks:
      - ppiq-net

  caddy:
    image: caddy:2.8-alpine
    container_name: ppiq-caddy
    restart: unless-stopped
    depends_on:
      - plantprocess-api
      - plantprocess-app-web
      - plantprocess-website
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ppiq-net

networks:
  ppiq-net:
    driver: bridge

volumes:
  ppiq_postgres_data:
  ppiq_api_logs:
  ppiq_worker_logs:
  ppiq_reports:
  ppiq_app_dumps:
  caddy_data:
  caddy_config:

