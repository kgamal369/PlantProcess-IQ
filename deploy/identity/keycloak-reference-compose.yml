services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --http-port=18080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "18080:18080"
    networks:
      - ppiq_identity

networks:
  ppiq_identity:
    driver: bridge