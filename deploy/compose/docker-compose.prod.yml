# PPIQ_REALIZATION_T016_CANONICAL_COMPOSE_PROD
# Production override. This is the single compose path referenced by Jenkins.

include:
  - docker-compose.base.yml

services:
  plantprocess-caddy:
    image: caddy:2.8-alpine
    container_name: plantprocess-caddy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - plantprocess-caddy-data:/data
      - plantprocess-caddy-config:/config
    depends_on:
      - plantprocess-web
      - plantprocess-api
    networks:
      - plantprocess-private

volumes:
  plantprocess-caddy-data:
  plantprocess-caddy-config: