# PPIQ-T022 overlay - layer ON TOP of the canonical compose for a test session:
#   docker compose -p plantprocessiq \
#     -f Infrastructure/deploy/docker-compose.demo.yml \
#     -f deploy/compose/docker-compose.testmode.yml up -d
# NEVER leave this overlay applied for the customer presentation.
services:
  app-api:        # adjust if your API service has a different name
    environment:
      PPIQ_TESTMODE__SeedUsers: "true"
      PPIQ_TESTMODE__ForceTier: "${PPIQ_TESTMODE_FORCETIER:-Enterprise}"
      PlantProcess__Auth__RequireAdminMfa: "false"
      PLANTPROCESS_ALLOWED_ORIGINS: "${PPIQ_ALLOWED_ORIGINS:-http://localhost:5173},http://localhost:3000"