# ==============================================================================
# SERVER overlay (M1-T01) - production VPS.
# Option 1 topology: the long-lived INFRASTRUCTURE Caddy (project plantprocessiq,
# container ppiq-caddy) owns ports 80/443 and fronts BOTH the app and Jenkins.
# This overlay therefore does NOT run its own Caddy. Instead it joins the app
# API + Web to the infra edge network (plantprocessiq_ppiq-net, aliased ppiq-edge)
# so the infra Caddy can reach them by container name. Real secrets come from
# deploy/compose/.env on the server (gitignored) and /var/lib/ppiq-preserve/.env.
# ==============================================================================
services:
  plantprocess-api:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - plantprocess-private
      - ppiq-edge

  plantprocess-web:
    restart: unless-stopped
    networks:
      - plantprocess-private
      - ppiq-edge

  plantprocess-website:
    restart: unless-stopped
    networks:
      - plantprocess-private
      - ppiq-edge

networks:
  ppiq-edge:
    external: true
    name: plantprocessiq_ppiq-net