# ==============================================================================
# PlantProcess IQ — CANONICAL compose base (M1-T01)
# ------------------------------------------------------------------------------
# The ONE base file. App stack ONLY: Postgres + API + Web.
# Demo SOURCE-emulation databases live in deploy/compose/docker-compose.sources.yml
# (M1-T04) and are intentionally NOT declared here.
# No public Postgres port is published in the base; overlays decide exposure.
#
# Overlays (compose -f base -f <overlay>):
#   docker-compose.local.yml   developer laptop (publishes DB to 127.0.0.1)
#   docker-compose.ci.yml      ephemeral pipeline stack (no host ports)
#   docker-compose.server.yml  production VPS (Caddy + restart policies)
# ==============================================================================
name: ppiq-app

services:
  plantprocess-postgres:
    image: postgres:16-alpine
    container_name: plantprocess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - plantprocess-postgres-data:/var/lib/postgresql/data
    networks:
      - plantprocess-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  plantprocess-api:
    build:
      context: ../../Backend
      dockerfile: PlantProcess.Api/Dockerfile
    image: ${PPIQ_API_IMAGE:-plantprocess-api:local}
    container_name: plantprocess-api
    restart: unless-stopped
    # Load the WHOLE generated .env into the container so every key the runtime-env
    # generator writes (admin user, signing key, etc.) reaches the API - not only the
    # keys explicitly listed under environment: below. .env sits next to this compose
    # file (deploy/compose/.env); env_file resolves relative to the compose file dir.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:5063
      # --- M1-T01 FIX --------------------------------------------------------
      # The app requires ConnectionStrings__PlantProcessDb (StartupConfigurationValidator /
      # P01P02StartupGuard). Inject ONLY the canonical key so there is one source of truth.
      ConnectionStrings__PlantProcessDb: Host=plantprocess-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      PlantProcess__Auth__SigningKey: ${PlantProcess__Auth__SigningKey}
      PlantProcess__Auth__Issuer: ${PlantProcess__Auth__Issuer:-plantprocess-iq}
      PlantProcess__Auth__Audience: ${PlantProcess__Auth__Audience:-plantprocess-iq-clients}
      PlantProcess__Auth__BootstrapAdminPassword: ${PlantProcess__Auth__BootstrapAdminPassword:-__DISABLED__}
      PLANTPROCESS_ALLOWED_ORIGINS: ${PLANTPROCESS_ALLOWED_ORIGINS}
    depends_on:
      plantprocess-postgres:
        condition: service_healthy
    networks:
      - plantprocess-private

  plantprocess-web:
    build:
      context: ../../Frontend/PlantProcess.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ${PPIQ_WEB_IMAGE:-plantprocess-web:local}
    container_name: plantprocess-web
    restart: unless-stopped
    depends_on:
      - plantprocess-api
    networks:
      - plantprocess-private

networks:
  plantprocess-private:
    driver: bridge

volumes:
  plantprocess-postgres-data: