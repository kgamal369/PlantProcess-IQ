# ============================================================================
# PlantProcess IQ — emulated customer SOURCE systems (M1-T04)
# 8 sources: 6 database containers + 2 committed CSV file-sources.
# Loopback-only published ports (offsets) so they never clash with the app DB
# or leak off-box. Seeds are the committed fixtures under deploy/fixtures/demo/.
# Bring up:  docker compose -f deploy/compose/docker-compose.sources.yml up -d
# (or ppiq.ps1 up-sources). First boot runs each engine's init scripts on the
# EMPTY volume; counts are deterministic because the seeds are static SQL.
# NOTE: Oracle/MSSQL/MySQL service definitions are reconstructed from standard
# image conventions — diff against your original docker-compose.demo-sources.yml.
# ============================================================================
name: ppiq-sources

services:
  # --- 1. Melt shop — PostgreSQL (heats) ---  host 15432
  meltshop-postgres:
    image: postgres:16-alpine
    container_name: ppiq-src-meltshop-postgres
    environment:
      POSTGRES_USER: ${SRC_PG_USER:-ppiq_src}
      POSTGRES_PASSWORD: ${SRC_PG_PASSWORD:-ppiq_src_local_only}
      POSTGRES_DB: ${SRC_PG_DB:-meltshop}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ../fixtures/demo/meltshop-postgres/init:/docker-entrypoint-initdb.d:ro
      - ppiq-src-meltshop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SRC_PG_USER:-ppiq_src} -d ${SRC_PG_DB:-meltshop}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [ppiq-sources]

  # --- 2. Caster — Oracle (casts) ---  host 11521
  caster-oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ppiq-src-caster-oracle
    environment:
      ORACLE_PASSWORD: ${SRC_ORA_PASSWORD:-ppiq_src_local_only}
      APP_USER: ${SRC_ORA_USER:-ppiq_src}
      APP_USER_PASSWORD: ${SRC_ORA_PASSWORD:-ppiq_src_local_only}
    ports:
      - "127.0.0.1:11521:1521"
    volumes:
      - ../fixtures/demo/caster-oracle/init:/container-entrypoint-initdb.d:ro
      - ppiq-src-caster-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
    networks: [ppiq-sources]

  # --- 3. HSM — Oracle (coils / surface) ---  host 11522
  hsm-oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ppiq-src-hsm-oracle
    environment:
      ORACLE_PASSWORD: ${SRC_ORA_PASSWORD:-ppiq_src_local_only}
      APP_USER: ${SRC_ORA_USER:-ppiq_src}
      APP_USER_PASSWORD: ${SRC_ORA_PASSWORD:-ppiq_src_local_only}
    ports:
      - "127.0.0.1:11522:1521"
    volumes:
      - ../fixtures/demo/hsm-oracle/init:/container-entrypoint-initdb.d:ro
      - ppiq-src-hsm-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
    networks: [ppiq-sources]

  # --- 4. PKL — SQL Server (pickling line) ---  host 11433
  pkl-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ppiq-src-pkl-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SRC_MSSQL_PASSWORD:-Ppiq_Src_Local_Only1}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - ppiq-src-pkl-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [ppiq-sources]

  # MSSQL has no native init-script support: this helper applies the seed once the server is healthy.
  pkl-mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ppiq-src-pkl-mssql-init
    depends_on:
      pkl-mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SRC_MSSQL_PASSWORD:-Ppiq_Src_Local_Only1}
    volumes:
      - ../fixtures/demo/pkl-mssql/init:/seed:ro
    entrypoint: ["/bin/bash","-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S pkl-mssql -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -i /seed/001_schema_seed.sql -i /seed/002_data.sql
    restart: "no"
    networks: [ppiq-sources]

  # --- 5. Downtime — MySQL ---  host 13306
  downtime-mysql:
    image: mysql:8
    container_name: ppiq-src-downtime-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SRC_MYSQL_ROOT:-ppiq_src_root_local}
      MYSQL_DATABASE: ${SRC_MYSQL_DOWNTIME_DB:-downtime}
      MYSQL_USER: ${SRC_MYSQL_USER:-ppiq_src}
      MYSQL_PASSWORD: ${SRC_MYSQL_PASSWORD:-ppiq_src_local_only}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ../fixtures/demo/downtime-mysql/init:/docker-entrypoint-initdb.d:ro
      - ppiq-src-downtime-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ppiq-sources]

  # --- 6. Parsytec — MySQL (surface inspection) ---  host 13307
  parsytec-mysql:
    image: mysql:8
    container_name: ppiq-src-parsytec-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SRC_MYSQL_ROOT:-ppiq_src_root_local}
      MYSQL_DATABASE: ${SRC_MYSQL_PARSYTEC_DB:-parsytec}
      MYSQL_USER: ${SRC_MYSQL_USER:-ppiq_src}
      MYSQL_PASSWORD: ${SRC_MYSQL_PASSWORD:-ppiq_src_local_only}
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - ../fixtures/demo/parsytec-mysql/init:/docker-entrypoint-initdb.d:ro
      - ppiq-src-parsytec-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ppiq-sources]

# --- 7 & 8. Excel file-sources (no container) -------------------------------
# The Yard inventory and QA-sample sources are committed CSV fixtures read
# directly by the app's CSV connector (mounted into the app at runtime), not
# standalone services:
#   deploy/fixtures/demo/excel-yard/yard_inventory.csv   (~5,600 coils)
#   deploy/fixtures/demo/excel-qa/qa_samples.csv         (~1,868 QA samples)

networks:
  ppiq-sources:
    name: ppiq-sources
    driver: bridge

volumes:
  ppiq-src-meltshop-data:
  ppiq-src-caster-data:
  ppiq-src-hsm-data:
  ppiq-src-pkl-data:
  ppiq-src-downtime-data:
  ppiq-src-parsytec-data: