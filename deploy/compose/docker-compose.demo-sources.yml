name: plantprocessiq-demo-sources

networks:
  ppiq-demo-sources:
    driver: bridge

volumes:
  ppiq_meltshop_pg_data:
  ppiq_caster_oracle_data:
  ppiq_hsm_oracle_data:
  ppiq_pkl_mssql_data:
  ppiq_downtime_mysql_data:
  ppiq_parsytec_mysql_data:

services:
  meltshop-postgres:
    image: postgres:16-alpine
    container_name: ppiq-source-meltshop-postgres
    environment:
      POSTGRES_DB: meltshop
      POSTGRES_USER: meltshop_owner
      POSTGRES_PASSWORD: meltshop_demo_pwd
    volumes:
      - ppiq_meltshop_pg_data:/var/lib/postgresql/data
      - ./deploy/fixtures/demo/meltshop-postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meltshop_owner -d meltshop"]
      interval: 10s
      timeout: 5s
      retries: 10

  caster-oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: ppiq-source-caster-oracle
    environment:
      ORACLE_PASSWORD: caster_demo_pwd
      APP_USER: caster_owner
      APP_USER_PASSWORD: caster_demo_pwd
    volumes:
      - ppiq_caster_oracle_data:/opt/oracle/oradata
      - ./deploy/fixtures/demo/caster-oracle/init:/container-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20

  hsm-oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: ppiq-source-hsm-oracle
    environment:
      ORACLE_PASSWORD: hsm_demo_pwd
      APP_USER: hsm_owner
      APP_USER_PASSWORD: hsm_demo_pwd
    volumes:
      - ppiq_hsm_oracle_data:/opt/oracle/oradata
      - ./deploy/fixtures/demo/hsm-oracle/init:/container-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20

  pkl-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ppiq-source-pkl-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Ppiq_Demo_2026_Strong!
    volumes:
      - ppiq_pkl_mssql_data:/var/opt/mssql
      - ./deploy/fixtures/demo/pkl-mssql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ppiq_Demo_2026_Strong! -C -Q \"SELECT 1\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  downtime-mysql:
    image: mysql:8.4
    container_name: ppiq-source-downtime-mysql
    environment:
      MYSQL_DATABASE: downtime
      MYSQL_USER: downtime_owner
      MYSQL_PASSWORD: downtime_demo_pwd
      MYSQL_ROOT_PASSWORD: downtime_root_pwd
    volumes:
      - ppiq_downtime_mysql_data:/var/lib/mysql
      - ./deploy/fixtures/demo/downtime-mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u downtime_owner -pdowntime_demo_pwd"]
      interval: 10s
      timeout: 5s
      retries: 20

  parsytec-mysql:
    image: mysql:8.4
    container_name: ppiq-source-parsytec-mysql
    environment:
      MYSQL_DATABASE: parsytec
      MYSQL_USER: parsytec_owner
      MYSQL_PASSWORD: parsytec_demo_pwd
      MYSQL_ROOT_PASSWORD: parsytec_root_pwd
    volumes:
      - ppiq_parsytec_mysql_data:/var/lib/mysql
      - ./deploy/fixtures/demo/parsytec-mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u parsytec_owner -pparsytec_demo_pwd"]
      interval: 10s
      timeout: 5s
      retries: 20

  excel-yard:
    image: alpine:3.20
    container_name: ppiq-source-excel-yard
    command: ["sh", "-c", "while true; do test -f /data/yard_inventory.csv && sleep 30; done"]
    volumes:
      - ./deploy/fixtures/demo/excel-yard:/data:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/yard_inventory.csv"]
      interval: 10s
      timeout: 5s
      retries: 5

  excel-qa:
    image: alpine:3.20
    container_name: ppiq-source-excel-qa
    command: ["sh", "-c", "while true; do test -f /data/qa_samples.csv && sleep 30; done"]
    volumes:
      - ./deploy/fixtures/demo/excel-qa:/data:ro
    networks:
      - ppiq-demo-sources
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/qa_samples.csv"]
      interval: 10s
      timeout: 5s
      retries: 5
