# PPIQ_REALIZATION_T016_CANONICAL_COMPOSE_BASE
# Base compose file. No public Postgres port is published here.

services:
  plantprocess-postgres:
    image: postgres:16-alpine
    container_name: plantprocess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - plantprocess-postgres-data:/var/lib/postgresql/data
    networks:
      - plantprocess-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  plantprocess-api:
    image: ${PPIQ_API_IMAGE}
    container_name: plantprocess-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=plantprocess-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      plantprocess-postgres:
        condition: service_healthy
    networks:
      - plantprocess-private

  plantprocess-web:
    image: ${PPIQ_WEB_IMAGE}
    container_name: plantprocess-web
    restart: unless-stopped
    depends_on:
      - plantprocess-api
    networks:
      - plantprocess-private

networks:
  plantprocess-private:
    driver: bridge

volumes:
  plantprocess-postgres-data: