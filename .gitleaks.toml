title = "PPIQ gitleaks"
[extend]
useDefault = true
[allowlist]
description = "Vendored, generated, non-source, and server-only runtime config paths."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)bin/''',
  '''(^|/)obj/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.git/''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\.[^/]+$''',
  '''(^|/)deploy/compose/\.env$''',
  '''(^|/)deploy/caddy/Caddyfile$''',
  '''(^|/)Documentation/v5/ed25519-license-dev/''',
  '''(^|/)Documentation/v5/oidc-runtime-dev/''',
]
