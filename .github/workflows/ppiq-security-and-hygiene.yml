name: ppiq-security-and-hygiene

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UTF-8 no BOM gate
        shell: pwsh
        run: ./tools/phase1-phase2/Test-Utf8NoBom.ps1 -ProjectRoot .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}