version: '3.8'
services:
  ppiq-postgres:
    image: postgres:16-alpine
    container_name: ppiq-postgres
    environment:
      POSTGRES_USER: plantprocess_admin
      POSTGRES_PASSWORD: plantprocess_secure_password_mask
      POSTGRES_DB: plantprocess_app_db
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ppiq-network
networks:
  ppiq-network:
    name: ppiq-network
