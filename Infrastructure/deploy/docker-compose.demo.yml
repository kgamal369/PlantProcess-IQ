# ============================================================================
# PlantProcess IQ - self-contained DEMO deployment stack
# Canonical compose consumed by the CI/CD pipeline (Jenkinsfile DEPLOY_DIR=deploy/compose).
# Build contexts are relative to THIS file: repo root = ../../
# Secrets are interpolated from a server-only deploy/compose/.env (auto-loaded by
# docker compose, gitignored). Non-secret defaults match the demo database.
#
# NOTE: stages 3/4 of the pipeline build+recreate ONLY the four app services
#       (--no-deps), so ppiq-postgres is never recreated and its data volume is
#       never touched by a deploy. Do NOT run a bare `docker compose up` that
#       includes ppiq-postgres on the server unless you have verified the volume.
# ============================================================================
name: ppiq-demo

services:

  ppiq-postgres:
    image: postgres:16-alpine
    container_name: ppiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantprocess_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plantprocess_app_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ppiq-postgres-data:/var/lib/postgresql/data
    networks:
      - ppiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantprocess_admin} -d ${POSTGRES_DB:-plantprocess_app_db}"]
      interval: 10s
      timeout: 5s
      retries: 12

  plantprocess-api:
    build:
      context: ../../Backend
      dockerfile: PlantProcess.Api/Dockerfile
    image: plantprocess-api:latest
    container_name: plantprocess-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The API image listens on :5063 (Backend/PlantProcess.Api/Dockerfile).
      # If your running Caddy reverse-proxies to plantprocess-api:8080 instead,
      # uncomment the next line so the container listens where Caddy expects:
      # ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "Host=ppiq-postgres;Port=5432;Database=${POSTGRES_DB:-plantprocess_app_db};Username=${POSTGRES_USER:-plantprocess_admin};Password=${POSTGRES_PASSWORD}"
    depends_on:
      ppiq-postgres:
        condition: service_healthy
    networks:
      - ppiq-network

  plantprocess-workers:
    build:
      context: ../../Backend
      dockerfile: PlantProcess.Workers/Dockerfile
    image: plantprocess-workers:latest
    container_name: plantprocess-workers
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=ppiq-postgres;Port=5432;Database=${POSTGRES_DB:-plantprocess_app_db};Username=${POSTGRES_USER:-plantprocess_admin};Password=${POSTGRES_PASSWORD}"
    depends_on:
      ppiq-postgres:
        condition: service_healthy
    networks:
      - ppiq-network

  plantprocess-app-web:
    build:
      context: ../../Frontend/PlantProcess.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: plantprocess-app-web:latest
    container_name: plantprocess-app-web
    restart: unless-stopped
    depends_on:
      - plantprocess-api
    networks:
      - ppiq-network

  plantprocess-website:
    build:
      context: ../../Website/PlantProcess.Website
      dockerfile: Dockerfile
      args:
        VITE_WEBSITE_API_BASE_URL: ${VITE_WEBSITE_API_BASE_URL:-/api}
    image: plantprocess-website:latest
    container_name: plantprocess-website
    restart: unless-stopped
    networks:
      - ppiq-network

networks:
  ppiq-network:
    name: ppiq-network

volumes:
  ppiq-postgres-data:
    name: ppiq-postgres-data